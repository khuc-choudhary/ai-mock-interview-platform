# Render Blueprint: backend (Docker) + PostgreSQL + static frontend.
# Render dashboard -> New -> Blueprint -> select this repo. Verify plan names/limits there; free tiers change.
databases:
  - name: mockinterview-db
    plan: free
    databaseName: mock_interview
    user: mockinterview

services:
  - type: web
    name: mockinterview-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mockinterview-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS # your frontend URL, e.g. https://mockinterview-web.onrender.com
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_REASONING_EFFORT
        value: low
      - key: WHISPER_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: WHISPER_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: whisper-large-v3
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: mockinterview-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL # your API URL, e.g. https://mockinterview-api.onrender.com
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
